<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Captain Rakesh Mohan Shyam Degree College, Bharnakalan, Mathura. Affiliated with Dr. B. R. Ambedkar University, Agra. College Code: 0538.">
  <title>Captain Rakesh Mohan Shyam Degree College | Mathura (Code: 0538)</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="college-logo.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Campus Background Images -->
  <div class="slider" id="slider">
    <div class="slide active" style="background-image: url('images/campus-building.jpg');" data-title="College Campus & Academic Wing"></div>
    <div class="slide" style="background-image: url('images/campus-entrance.jpg');" data-title="Administrative Entrance & Porch"></div>
    <div class="slide" style="background-image: url('images/campus-grounds.jpg');" data-title="Lush Green Campus & Sports Grounds"></div>
  </div>

  <!-- Unobtrusive Top Bar with Just the College Text -->
  <header class="college-header">
    <div class="header-inner">
      <img src="college-logo.svg" alt="College Logo" class="logo">
      <div class="title-wrap">
        <h1 class="college-name">Captain Rakesh Mohan Shyam Degree College</h1>
        <p class="college-details">
          <span class="detail-item">📍 Bharnakalan, Mathura</span>
          <span class="sep">•</span>
          <span class="detail-item">🎓 Affiliated with Dr. B. R. Ambedkar University, Agra</span>
          <span class="sep">•</span>
          <span class="detail-item code-tag">College Code: <strong>0538</strong></span>
        </p>
      </div>
    </div>
  </header>

  <!-- Navigation Arrows -->
  <button class="nav-arrow prev" id="prevBtn" title="Previous Image" aria-label="Previous Image">&#10094;</button>
  <button class="nav-arrow next" id="nextBtn" title="Next Image" aria-label="Next Image">&#10095;</button>

  <!-- Bottom Bar: Caption and Thumbnails -->
  <footer class="bottom-bar">
    <div class="caption" id="caption">College Campus & Academic Wing</div>
    <div class="thumbnails">
      <button class="thumb active" data-index="0" title="View Campus & Academic Wing">
        <img src="images/campus-building.jpg" alt="Building">
      </button>
      <button class="thumb" data-index="1" title="View Administrative Entrance">
        <img src="images/campus-entrance.jpg" alt="Entrance">
      </button>
      <button class="thumb" data-index="2" title="View Campus Grounds">
        <img src="images/campus-grounds.jpg" alt="Grounds">
      </button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
